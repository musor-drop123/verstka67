
services:

  db:
    image: postgres
    restart: always
    shm_size: 128mb

    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pgdata:/var/lib/postgresql/
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    restart: always
    ports:
        - "5433:5433"
volumes:
  pgdata:

    